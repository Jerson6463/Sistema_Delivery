{% extends "base.html" %}
{% block title %}Editar perfil{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-4">Editar perfil</h2>
    <form method="post">
      {% csrf_token %}
      {{ datos_form.as_p }}
      {% if perfil_form %}
        {{ perfil_form.as_p }}
      {% endif %}
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
    </form>
  </div>
</div>
{% endblock %}

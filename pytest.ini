[pytest]
DJANGO_SETTINGS_MODULE = config.settings

# Los tests viven en un `tests.py` por app (convención de Django). El default
# de pytest solo recoge `test_*.py`/`*_test.py`, así que sin esta línea no
# encontraría ninguno de los que ya existen.
python_files = tests.py test_*.py

# Las clases del proyecto usan sufijo (`SoftDeleteInstanciaTests`) y no el
# prefijo `Test*` que pytest busca por defecto. No hace falta configurarlo:
# heredan de django.test.TestCase y pytest recoge las subclases de
# unittest.TestCase por su cuenta.
